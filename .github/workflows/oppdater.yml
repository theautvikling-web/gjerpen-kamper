name: Oppdater kampoversikt
on:
  schedule:
    - cron: "17 * * * *"   # hver time
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bygg:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py ut
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ut
      - id: deploy
        uses: actions/deploy-pages@v4
