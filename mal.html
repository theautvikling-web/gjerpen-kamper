<title>Gjerpen IF kamper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: smal kolonne som passer i en iframe på klubbsiden; dato-grupper med kamprader */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#17202b; --muted:#5d6878; --line:#dde2ea;
  --accent:#b3261e; --accent-soft:#fbe9e7;
  --win:#1d7a46; --loss:#b3261e; --draw:#7a6a12;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2c3440;
  --accent:#f0766c; --accent-soft:#3a1f1e; --win:#5fcf8e; --loss:#f0766c; --draw:#d9c45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --fg:#e8ecf2; --muted:#9aa5b5; --line:#2c3440;
  --accent:#f0766c; --accent-soft:#3a1f1e; --win:#5fcf8e; --loss:#f0766c; --draw:#d9c45a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 2rem/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 8px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.tabs button{font:600 .95rem var(--body);border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,label.chk{font:inherit;font-size:.95rem}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{margin-top:22px}
.day h2{font:700 1rem/1 var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.m{display:grid;grid-template-columns:3.6rem 1fr auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);
  color:inherit;text-decoration:none;align-items:center}
.m:first-child{border-top:0}
.m:hover{background:var(--accent-soft)}
.t{font:600 1.05rem var(--display);font-variant-numeric:tabular-nums}
.teams{min-width:0}
.teams b{font-weight:700}
.meta{grid-column:2/4;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:2px 10px}
.chip{font:600 .78rem var(--body);padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.chip.home{border-color:var(--accent);color:var(--accent)}
.score{font:700 1.25rem var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score .p{display:inline-block;min-width:1.5em;text-align:center;font-size:.8rem;border-radius:4px;color:#fff;margin-left:6px;vertical-align:2px}
.p.S{background:var(--win)} .p.T{background:var(--loss)} .p.U{background:var(--draw)}
.na{font:400 .85rem var(--body);color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:28px}
.foot a{color:inherit}
@media (max-width:480px){.m{grid-template-columns:3rem 1fr auto}.meta{grid-column:1/4}}
</style>
<div class="wrap">
  <h1>Kamper</h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <div class="tabs" role="group" aria-label="Vis">
      <button id="tab-kommende" aria-pressed="true">Kommende</button>
      <button id="tab-spilte" aria-pressed="false">Spilte</button>
    </div>
    <select id="lag" aria-label="Velg lag"><option value="">Alle lag</option></select>
    <label class="chk"><input type="checkbox" id="hjemme"> Bare hjemmekamper</label>
  </div>
  <div id="out"></div>
  <div class="foot">Kilde: <a href="https://www.handball.no/system/kamper/klubb/?klubbid=60697" target="_blank" rel="noopener">handball.no</a>. Oppdateres automatisk. Minihåndball har ikke offentlige resultater.</div>
</div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const fmtDag=new Intl.DateTimeFormat("nb-NO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtOpp=new Intl.DateTimeFormat("nb-NO",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Oslo"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let vis=(location.hash==="#spilte")?"spilte":"kommende";
try{const v=localStorage.getItem("gif-lag");if(v)$("lag").dataset.init=v}catch(e){}

function lagNokkel(l){const m=/^([A-Z]+)(\d+)\s*(\d*)/.exec(l||"");return m?[m[1],+m[2],+(m[3]||1)]:[l,0,0]}
function utfall(k){if(!k.res||k.internt)return null;const [h,b]=k.res,v=k.gjerpenHjemme?h-b:b-h;return v>0?"S":v<0?"T":"U"}

function init(){
  $("sub").textContent=`Gjerpen IF håndball · sesongen ${sesongNavn()} · oppdatert ${fmtOpp.format(new Date(DATA.oppdatert))}`;
  const lag=[...new Set(DATA.kamper.flatMap(k=>k.lag2?[k.lag,k.lag2]:[k.lag]))].sort((a,b)=>{const x=lagNokkel(a),y=lagNokkel(b);return x[0].localeCompare(y[0])||x[1]-y[1]||x[2]-y[2]});
  for(const l of lag){const o=document.createElement("option");o.value=o.textContent=l;$("lag").append(o)}
  if($("lag").dataset.init&&lag.includes($("lag").dataset.init))$("lag").value=$("lag").dataset.init;
  $("tab-kommende").onclick=()=>{vis="kommende";render()};
  $("tab-spilte").onclick=()=>{vis="spilte";render()};
  $("lag").onchange=()=>{try{localStorage.setItem("gif-lag",$("lag").value)}catch(e){};render()};
  $("hjemme").onchange=render;
  render();
}
function sesongNavn(){const ds=DATA.kamper.map(k=>k.dato).sort();if(!ds.length)return"";const y=+ds[0].slice(0,4),m=+ds[0].slice(5,7);const s=m>=7?y:y-1;return `${s}/${String(s+1).slice(2)}`}

function render(){
  $("tab-kommende").setAttribute("aria-pressed",vis==="kommende");
  $("tab-spilte").setAttribute("aria-pressed",vis==="spilte");
  const lag=$("lag").value,hj=$("hjemme").checked;
  let ks=DATA.kamper.filter(k=>(vis==="spilte")===k.spilt&&(!lag||k.lag===lag||k.lag2===lag)&&(!hj||k.gjerpenHjemme));
  if(vis==="spilte")ks=ks.slice().reverse();
  if(!ks.length){$("out").innerHTML=`<div class="empty">Ingen ${vis==="spilte"?"spilte":"kommende"} kamper${lag?" for "+esc(lag):""}.</div>`;return}
  const grupper=new Map();for(const k of ks){if(!grupper.has(k.dato))grupper.set(k.dato,[]);grupper.get(k.dato).push(k)}
  let h="";
  for(const [d,rad] of grupper){
    const dag=fmtDag.format(new Date(d+"T12:00:00"));
    h+=`<section class="day"><h2>${esc(dag)}</h2><div class="list">`;
    for(const k of rad){
      const tid=k.tid?k.tid.slice(0,2)+":"+k.tid.slice(2):"";
      const hn=k.gjerpenHjemme?`<b>${esc(k.hjemme)}</b>`:esc(k.hjemme);
      const bn=(!k.gjerpenHjemme||k.internt)?`<b>${esc(k.borte)}</b>`:esc(k.borte);
      let høyre="";
      if(k.avlyst)høyre=`<span class="na">Avlyst</span>`;
      else if(k.utsatt)høyre=`<span class="na">Utsatt</span>`;
      else if(k.spilt)høyre=k.res?`<span class="score">${k.res[0]}–${k.res[1]}${(u=>u?`<span class="p ${u}" title="${{S:"Seier",T:"Tap",U:"Uavgjort"}[u]}">${u}</span>`:"")(utfall(k))}</span>`:`<span class="na">Ingen resultat</span>`;
      h+=`<a class="m" href="https://www.handball.no/system/kamper/kamp/?matchid=${k.id}" target="_blank" rel="noopener">
        <span class="t">${tid}</span><span class="teams">${hn} – ${bn}</span>${høyre}
        <span class="meta"><span class="chip${k.gjerpenHjemme?" home":""}">${esc(k.lag)}${k.lag2?" mot "+esc(k.lag2):""}${k.gjerpenHjemme?" · hjemme":""}</span><span>${esc(k.hall||"")}</span><span>${esc(k.turnering)}</span></span></a>`;
    }
    h+=`</div></section>`;
  }
  $("out").innerHTML=h;
}
init();
</script>
